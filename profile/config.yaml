# use-conda: true
jobs: 10

latency-wait: 60
reason: True

# default-resources:
#   slurm_partition: master-fasttrack

keep-going: True
printshellcmds: True
rerun-incomplete: True
restart-times: 2
delete-temp-output: True


# PLEASE MODIFY THE BELOW PATH
conda-prefix: alignment_pipeline/conda_envs
singularity-prefix: alignment_pipeline/Singularity
singularity-args: "-B /:/"
