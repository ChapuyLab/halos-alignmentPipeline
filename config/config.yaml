SeqType: "<WGS/WES/Panel>" # Sequencing type: "WGS", "WES", or "Panel"

library_prep_kit: "<library_prep_kit>" # Library preparation kit name for read-group metadata (defaults to "Unknown" if empty/omitted)

pid: "<PATIENT_ID>" # Patient ID string (used as output prefix: {pid}_{sample})
sample: "<SAMPLE_TYPE>" # Sample name string (matches SAMPLE_TYPE in metadata if using FASTQ metadata mode)

# Provide ONE of 'metadata', 'bamfile', OR 'sra' (do not set more than one):
metadata: /path/to/metadata.csv # CSV/TSV metadata sheet with columns: PATIENT_ID, SAMPLE_TYPE, SAMPLE_NAME, RUN_ID, LANE_NO, READ, FASTQ_FILE
# bamfile: /path/to/input.bam # Path to input BAM file (aligned or unaligned, paired-end)
# sra: <SRR_ACCESSION> # NCBI SRA run accession (e.g., SRR12345678)
# ngc: /path/to/repository_key.ngc # Optional: dbGaP/SRA .ngc key file for controlled-access SRA accessions

work_dir: /path/to/work_dir # Absolute path to output directory for final CRAMs and QC metrics
log_dir: /path/to/work_dir/logs # Absolute path to log directory (defaults to {work_dir}/logs if omitted)
# scratch_dir: /path/to/scratch_dir # Optional: directory for intermediate FASTQ/BAM files and temp space (defaults to work_dir)

genome: /path/to/reference_genome.fa # Absolute path to BWA-indexed reference genome FASTA (.amb, .ann, .bwt, .pac, .sa in same directory)
dbsnp: /path/to/dbsnp.vcf.gz # Absolute path to bgzipped + tabix-indexed dbSNP VCF for GATK BaseRecalibrator

target_regions: /path/to/target_regions.bed # Target capture regions BED file (required if SeqType is "WES" or "Panel")
bait_regions: /path/to/bait_regions.bed # Bait capture regions BED file (optional for "WES"/"Panel"; computed from target_regions if omitted)

chrom_sizes: /path/to/chrom_sizes.tsv # Tab-separated chromosome names and lengths matching the reference genome (required for "WES"/"Panel")
dict_genome: /path/to/reference_genome.dict # Picard/GATK sequence dictionary (.dict) for the reference genome (required for "WES"/"Panel")

trim_adapters: False # True to trim adapters with cutadapt and run FastQC, False to skip trimming
# adapter_forward_read: [
#     "AGATCGGAAGAGCACACGTCTGAACTCCAGTCA",
#   ] # List of R1 adapter sequences (required if trim_adapters is True)
# adapter_reverse_read: [
#     "AGATCGGAAGAGCGTCGTGTAGGGAAAGAGTGT",
#   ] # List of R2 adapter sequences (required if trim_adapters is True)
# extra_cutadapt_params: "" # Optional extra CLI flags passed to cutadapt
# extra_samtools_convert_params: "" # Optional extra CLI flags passed to samtools fastq (BAM mode only)

max_coverage: 10000 # Maximum coverage cap for QC reporting (defaults to 10000)
